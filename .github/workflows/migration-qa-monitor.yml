name: Migration QA Regression Monitor

on:
  schedule:
    # Run hourly; Job 1 cheaply skips Job 2 if develop has no new app/migration changes.
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Bypass the change gate and force a QA audit even with no new commits'
        type: boolean
        default: false
      slice:
        description: 'Target slice ID (e.g., A1) or "auto" to audit changed/active slices'
        type: string
        default: 'auto'
      runtime:
        description: 'Cursor Agent SDK runtime ("cloud" spins up the pre-warmed .cursor/environment.json VM)'
        type: choice
        options:
          - cloud
          - local
        default: cloud
      dry_run:
        description: 'Run the full QA audit without creating GitHub issues or advancing qa/last-audited'
        type: boolean
        default: false
      model:
        description: 'Optional Cursor model ID override (leave empty for Cursor Cloud default)'
        type: string
        default: ''

concurrency:
  group: migration-qa-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Ultra-cheap (~3-5s) change gate — NO Node, NO Rust, NO Electron,
  # and NO Cursor Agent/VM spin-up when nothing relevant changed since the last
  # audited commit (tracked via the lightweight moving tag `qa/last-audited`).
  # ---------------------------------------------------------------------------
  check-changes:
    name: Check for Changes Since Last QA Audit
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      head_sha: ${{ steps.gate.outputs.head_sha }}
      base_sha: ${{ steps.gate.outputs.base_sha }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - name: Compare develop HEAD against qa/last-audited watermark
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_RUN: ${{ inputs.force || 'false' }}
          TARGET_SLICE: ${{ inputs.slice || 'auto' }}
        run: |
          set -euo pipefail
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          HEAD_SHA=$(git ls-remote "$REPO_URL" refs/heads/develop | awk '{print $1}')
          BASE_SHA=$(git ls-remote "$REPO_URL" refs/tags/qa/last-audited | awk '{print $1}' || true)

          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "base_sha=${BASE_SHA}" >> "$GITHUB_OUTPUT"

          if [ -z "$HEAD_SHA" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "reason=Could not resolve refs/heads/develop" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$FORCE_RUN" = "true" ] || [ "$TARGET_SLICE" != "auto" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=Manual override (force=${FORCE_RUN}, slice=${TARGET_SLICE})" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$BASE_SHA" ] && [ "$HEAD_SHA" = "$BASE_SHA" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "reason=No new commits on develop since qa/last-audited (${HEAD_SHA:0:8})" >> "$GITHUB_OUTPUT"
            echo "No changes since ${HEAD_SHA:0:8} — skipping QA agent spin-up."
            exit 0
          fi

          # First-ever run (no qa/last-audited tag yet): run a baseline audit.
          if [ -z "$BASE_SHA" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=Initial baseline audit (no qa/last-audited tag found)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Lightweight blobless fetch to check whether any app/migration paths changed.
          git init -q gate-repo
          cd gate-repo
          git remote add origin "$REPO_URL"
          git fetch -q --filter=blob:none --no-tags origin "$HEAD_SHA" "$BASE_SHA"
          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          if echo "$CHANGED_FILES" | grep -Eq '^(rust/|packages/desktop/src/|packages/muya/src/|scripts/migration-measure\.ts|docs/migration/(STATUS\.md|slices\.json))$'; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=Detected app/migration changes in ${BASE_SHA:0:8}..${HEAD_SHA:0:8}" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "reason=New commits in ${BASE_SHA:0:8}..${HEAD_SHA:0:8} did not touch app/migration paths" >> "$GITHUB_OUTPUT"
            echo "Only non-app paths changed — skipping QA agent spin-up."
          fi

      - name: Write gate summary
        run: |
          {
            echo "### QA Change Gate"
            echo "- **Should run QA agent:** \`${{ steps.gate.outputs.should_run }}\`"
            echo "- **Reason:** ${{ steps.gate.outputs.reason }}"
            echo "- **Range:** \`${{ steps.gate.outputs.base_sha || 'baseline' }}\` → \`${{ steps.gate.outputs.head_sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Job 2: QA / TPM Regression Audit (only spins up when Job 1 detects changes)
  # Uses @cursor/sdk to launch a read-only Cursor Cloud Agent VM built from
  # `.cursor/environment.json`, compares Legacy vs. Migrated slices, applies
  # the P0-P3 severity rubric, and files deduplicated GitHub Issues.
  # ---------------------------------------------------------------------------
  qa-audit:
    name: Run QA/TPM Regression Audit & File Issues
    needs: check-changes
    if: needs.check-changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-changes.outputs.head_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install @cursor/sdk (lightweight orchestrator install)
        run: |
          # Cloud runtime executes MarkText/Rust/Playwright inside the pre-warmed
          # Cursor Cloud Agent VM (.cursor/environment.json), so this GHA runner
          # only needs @cursor/sdk to orchestrate the run and file GitHub issues.
          npm install --no-save @cursor/sdk@^1.4.2

      - name: Run Migration QA Monitor
        id: monitor
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          ARGS=(
            "--runtime" "${{ inputs.runtime || 'cloud' }}"
            "--repo" "${{ github.repository }}"
            "--head-sha" "${{ needs.check-changes.outputs.head_sha }}"
            "--slice" "${{ inputs.slice || 'auto' }}"
            "--out" "/tmp/qa-audit-telemetry.json"
          )

          if [ -n "${{ needs.check-changes.outputs.base_sha }}" ]; then
            ARGS+=("--base-sha" "${{ needs.check-changes.outputs.base_sha }}")
          fi
          if [ "${{ inputs.force || 'false' }}" = "true" ]; then
            ARGS+=("--force")
          fi
          if [ "${{ inputs.dry_run || 'false' }}" = "true" ]; then
            ARGS+=("--dry-run")
          fi
          if [ -n "${{ inputs.model || '' }}" ]; then
            ARGS+=("--model" "${{ inputs.model }}")
          fi

          node --no-warnings scripts/qa-monitor/run-qa-monitor.ts "${ARGS[@]}"

      - name: Publish QA Audit Summary
        if: always() && hashFiles('/tmp/qa-audit-telemetry.json') != ''
        run: |
          node --no-warnings -e '
            const fs = require("node:fs")
            const data = JSON.parse(fs.readFileSync("/tmp/qa-audit-telemetry.json", "utf8"))
            const lines = [
              "## Migration QA Monitor Report",
              "",
              data.summary,
              "",
              "| Metric | Value |",
              "| --- | --- |",
              `| Runtime | \`${data.runtime}\` |`,
              `| Agent ID | \`${data.agentId ?? "n/a"}\` |`,
              `| Slices Audited | ${(data.slicesAudited || []).map((s) => `\`${s}\``).join(", ") || "none"} |`,
              `| Duration | ${(data.durationMs / 1000).toFixed(1)}s |`,
              `| Findings | **${data.findingsTotal}** (P0: ${data.findingsBySeverity.P0}, P1: ${data.findingsBySeverity.P1}, P2: ${data.findingsBySeverity.P2}, P3: ${data.findingsBySeverity.P3}) |`,
              `| Issues Filed | ${data.issuesFiled} (Duplicates skipped: ${data.duplicatesSkipped}) |`,
              `| Dry Run | \`${data.dryRun}\` |`
            ]
            if (Array.isArray(data.filedIssues) && data.filedIssues.length > 0) {
              lines.push("", "### Findings", "", "| Severity | Slice | Status | Title |", "| --- | --- | --- | --- |")
              for (const item of data.filedIssues) {
                const link = item.issueUrl ? `[${item.title}](${item.issueUrl})` : item.title
                lines.push(`| \`${item.severity}\` | \`${item.slice}\` | \`${item.status}\` | ${link} |`)
              }
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n")
          '

      - name: Upload QA telemetry artifact
        if: always() && hashFiles('/tmp/qa-audit-telemetry.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: qa-audit-telemetry-${{ github.run_number }}
          path: /tmp/qa-audit-telemetry.json
          retention-days: 30

      - name: Advance qa/last-audited watermark tag
        if: success() && !inputs.dry_run
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f qa/last-audited "${{ needs.check-changes.outputs.head_sha }}"
          git push origin refs/tags/qa/last-audited --force
