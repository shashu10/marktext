name: Migration QA Regression Monitor

on:
  schedule:
    # Run hourly; Job 1 cheaply skips Job 2 if develop has no new app/migration changes.
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Bypass the change gate and force a QA audit even with no new commits'
        type: boolean
        default: false
      slice:
        description: 'Target slice ID (e.g., A1) or "auto" to audit changed/active slices'
        type: string
        default: 'auto'
      runtime:
        description: 'Cursor Agent SDK runtime ("cloud" spins up the pre-warmed .cursor/environment.json VM)'
        type: choice
        options:
          - cloud
          - local
        default: cloud
      dry_run:
        description: 'Run the full QA audit without creating GitHub issues or advancing qa/last-audited'
        type: boolean
        default: false
      model:
        description: 'Optional Cursor model ID override (leave empty for Cursor Cloud default)'
        type: string
        default: ''

concurrency:
  group: migration-qa-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Ultra-cheap (~3-5s) change gate — NO Node, NO Rust, NO Electron,
  # and NO Cursor Agent/VM spin-up when nothing relevant changed since the last
  # audited commit (tracked via the lightweight moving tag `qa/last-audited`).
  # ---------------------------------------------------------------------------
  check-changes:
    name: Check for Changes Since Last QA Audit
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      head_sha: ${{ steps.gate.outputs.head_sha }}
      base_sha: ${{ steps.gate.outputs.base_sha }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - name: Compare develop HEAD against qa/last-audited watermark
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_RUN: ${{ inputs.force || 'false' }}
          TARGET_SLICE: ${{ inputs.slice || 'auto' }}
        run: |
          set -euo pipefail
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          REFS=$(git ls-remote --refs "$REPO_URL" refs/heads/develop refs/tags/qa/last-audited)
          HEAD_SHA=$(awk '$2 == "refs/heads/develop" {print $1}' <<< "$REFS")
          BASE_SHA=$(awk '$2 == "refs/tags/qa/last-audited" {print $1}' <<< "$REFS")

          if [ -z "$HEAD_SHA" ]; then
            echo "::error::Could not resolve refs/heads/develop"
            exit 1
          fi

          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "base_sha=${BASE_SHA}" >> "$GITHUB_OUTPUT"

          if [ "$FORCE_RUN" = "true" ] || [ "$TARGET_SLICE" != "auto" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=Manual override (force=${FORCE_RUN}, slice=${TARGET_SLICE})" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$BASE_SHA" ] && [ "$HEAD_SHA" = "$BASE_SHA" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "reason=No new commits on develop since qa/last-audited (${HEAD_SHA:0:8})" >> "$GITHUB_OUTPUT"
            echo "No changes since ${HEAD_SHA:0:8} — skipping QA agent spin-up."
            exit 0
          fi

          # First-ever run (no qa/last-audited tag yet): run a baseline audit.
          if [ -z "$BASE_SHA" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=Initial baseline audit (no qa/last-audited tag found)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Lightweight blobless fetch to check whether any app/migration paths changed.
          git init -q gate-repo
          cd gate-repo
          git remote add origin "$REPO_URL"
          git fetch -q --filter=blob:none --no-tags origin "$HEAD_SHA" "$BASE_SHA"
          if git diff --quiet --no-renames "$BASE_SHA" "$HEAD_SHA" -- \
            rust/ packages/desktop/src/ packages/muya/src/ \
            scripts/migration-measure.ts docs/migration/STATUS.md docs/migration/slices.json; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "reason=New commits in ${BASE_SHA:0:8}..${HEAD_SHA:0:8} did not touch app/migration paths" >> "$GITHUB_OUTPUT"
            echo "Only non-app paths changed — skipping QA agent spin-up."
          else
            diff_status=$?
            if [ "$diff_status" -ne 1 ]; then exit "$diff_status"; fi
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=Detected app/migration changes in ${BASE_SHA:0:8}..${HEAD_SHA:0:8}" >> "$GITHUB_OUTPUT"
          fi

      - name: Write gate summary
        run: |
          {
            echo "### QA Change Gate"
            echo "- **Should run QA agent:** \`${{ steps.gate.outputs.should_run }}\`"
            echo "- **Reason:** ${{ steps.gate.outputs.reason }}"
            echo "- **Range:** \`${{ steps.gate.outputs.base_sha || 'baseline' }}\` → \`${{ steps.gate.outputs.head_sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  qa-audit:
    name: Run Cursor QA audit
    needs: check-changes
    if: needs.check-changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: read
    outputs:
      report_id: ${{ steps.save-report.outputs.artifact-id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-changes.outputs.head_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install @cursor/sdk (lightweight orchestrator install)
        run: |
          # Cloud runtime executes MarkText/Rust/Playwright inside the pre-warmed
          # Cursor Cloud Agent VM (.cursor/environment.json), so this GHA runner
          # only needs @cursor/sdk to orchestrate the run and file GitHub issues.
          npm install --no-save @cursor/sdk@^1.4.2

      - name: Run Migration QA Monitor
        id: monitor
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AUDIT_RUNTIME: ${{ inputs.runtime || 'cloud' }}
          AUDIT_HEAD: ${{ needs.check-changes.outputs.head_sha }}
          AUDIT_BASE: ${{ needs.check-changes.outputs.base_sha }}
          AUDIT_SLICE: ${{ inputs.slice || 'auto' }}
          AUDIT_FORCE: ${{ inputs.force || 'false' }}
          AUDIT_MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          ARGS=(
            --runtime "$AUDIT_RUNTIME"
            --repo "$GITHUB_REPOSITORY"
            --head-sha "$AUDIT_HEAD"
            --slice "$AUDIT_SLICE"
            --report-only
            --report-out qa-output/audit-report.json
            --out qa-output/telemetry.json
          )
          if [ -n "$AUDIT_BASE" ]; then ARGS+=(--base-sha "$AUDIT_BASE"); fi
          if [ "$AUDIT_FORCE" = "true" ]; then ARGS+=(--force); fi
          if [ -n "$AUDIT_MODEL" ]; then ARGS+=(--model "$AUDIT_MODEL"); fi

          node --no-warnings scripts/qa-monitor/run-qa-monitor.ts "${ARGS[@]}"

      - name: Save completed audit before filing
        id: save-report
        if: ${{ !cancelled() && hashFiles('qa-output/audit-report.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: qa-audit-report-${{ github.run_id }}
          path: qa-output/audit-report.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  file-findings:
    name: File findings from saved audit
    needs: [check-changes, qa-audit]
    if: needs.qa-audit.outputs.report_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-changes.outputs.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          name: qa-audit-report-${{ github.run_id }}
          path: qa-output

      - name: File findings or preview the report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUDIT_HEAD: ${{ needs.check-changes.outputs.head_sha }}
          AUDIT_DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          ARGS=(--replay qa-output/audit-report.json --repo "$GITHUB_REPOSITORY"
                --head-sha "$AUDIT_HEAD" --out qa-output/telemetry.json)
          if [ "$AUDIT_DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          node --no-warnings scripts/qa-monitor/run-qa-monitor.ts "${ARGS[@]}"

      - name: Publish QA Audit Summary
        id: summary
        if: ${{ !cancelled() && hashFiles('qa-output/telemetry.json') != '' }}
        env:
          AUDIT_HEAD: ${{ needs.check-changes.outputs.head_sha }}
        run: |
          node --no-warnings -e '
            const fs = require("node:fs")
            const data = JSON.parse(fs.readFileSync("qa-output/telemetry.json", "utf8"))
            const reported = new Set(data.slicesAudited.map(slice => slice.toUpperCase()))
            const missing = data.targetSlices.filter(slice => !reported.has(slice.toUpperCase()))
            const complete = !data.skipped && !data.dryRun && data.runStatus === "finished" &&
              data.headSha === process.env.AUDIT_HEAD && data.repoSlug === process.env.GITHUB_REPOSITORY &&
              data.targetSlices.length > 0 && missing.length === 0
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `audited=${complete}\n`)
            const lines = [
              "## Migration QA Monitor Report",
              "",
              data.summary,
              "",
              "| Metric | Value |",
              "| --- | --- |",
              `| Runtime | \`${data.runtime}\` |`,
              `| Agent ID | \`${data.agentId ?? "n/a"}\` |`,
              `| Slices Audited | ${(data.slicesAudited || []).map((s) => `\`${s}\``).join(", ") || "none"} |`,
              `| Duration | ${(data.durationMs / 1000).toFixed(1)}s |`,
              `| Findings | **${data.findingsTotal}** (P0: ${data.findingsBySeverity.P0}, P1: ${data.findingsBySeverity.P1}, P2: ${data.findingsBySeverity.P2}, P3: ${data.findingsBySeverity.P3}) |`,
              `| Issues Filed | ${data.issuesFiled} (Duplicates skipped: ${data.duplicatesSkipped}) |`,
              `| Dry Run | \`${data.dryRun}\` |`
            ]
            if (Array.isArray(data.filedIssues) && data.filedIssues.length > 0) {
              lines.push("", "### Findings", "", "| Severity | Slice | Status | Title |", "| --- | --- | --- | --- |")
              for (const item of data.filedIssues) {
                const link = item.issueUrl ? `[${item.title}](${item.issueUrl})` : item.title
                lines.push(`| \`${item.severity}\` | \`${item.slice}\` | \`${item.status}\` | ${link} |`)
              }
            }
            if (missing.length) {
              lines.push("", "Incomplete coverage: " + missing.join(", "))
              process.exitCode = 1
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n")
          '

      - name: Upload filing results
        if: ${{ !cancelled() && hashFiles('qa-output/telemetry.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: qa-audit-telemetry-${{ github.run_number }}-${{ github.run_attempt }}
          path: qa-output/telemetry.json
          if-no-files-found: error
          retention-days: 30

      - name: Advance qa/last-audited watermark tag
        if: success() && !inputs.dry_run && (inputs.slice == '' || inputs.slice == 'auto') && steps.summary.outputs.audited == 'true'
        env:
          AUDITED_HEAD: ${{ needs.check-changes.outputs.head_sha }}
          EXPECTED_BASE: ${{ needs.check-changes.outputs.base_sha }}
        run: |
          set -euo pipefail
          ref=refs/tags/qa/last-audited
          git push --force-with-lease="$ref:$EXPECTED_BASE" origin "$AUDITED_HEAD:$ref"
