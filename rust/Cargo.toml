[workspace]
resolver = "3"
members = [
    "crates/marktext-core",
    "crates/marktext-ui-kit",
    "crates/marktext-wasm-host",
    "crates/mt-pref-general",
    "crates/mt-pref-images",
]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.95"
publish = false

[workspace.dependencies]
gpui = { package = "gpui-ce", version = "=0.3.0", default-features = false }
gpui_platform = { package = "gpui_ce_platform", version = "=0.3.0", default-features = false }
gpui_elements = { package = "gpui_ce_elements", version = "=0.3.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
